# Publish MCP server — releases the package to npm and the public MCP Registry.
#
# Fires on any pushed tag matching `v*` (e.g. `v1.1.0`). The job:
#   1. Builds the TypeScript bundle.
#   2. Validates server.json against the MCP server.schema.json.
#   3. Audits the `npm pack` contents for accidentally-included secrets.
#   4. Syncs server.json `.version` to match the tag.
#   5. Publishes to npm as `io.github.revsmoke/promptrejectormcp` (see package.json).
#   6. Authenticates to the MCP Registry via GitHub OIDC (no static token).
#   7. Publishes the server entry to https://registry.modelcontextprotocol.io.
#
# Required secrets:
#   - NPM_TOKEN     Mandatory. npm automation token with publish rights for
#                   the `io.github.revsmoke` scope. Without it step
#                   "Publish to npm" fails.
#   - GITHUB_TOKEN  Auto-provided. Used implicitly for OIDC auth to the MCP
#                   Registry (`id-token: write` permission below).
name: Publish MCP server (npm + MCP Registry)

on:
  push:
    tags:
      - "v*"  # Run on version tags like v1.0.0

permissions:
  contents: read
  id-token: write  # Required for GitHub OIDC auth to MCP Registry

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Validate server.json against MCP schema
        run: npx -y ajv-cli validate -s https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json -d server.json

      - name: Audit npm pack contents (fail on leaked files)
        run: |
          npm pack --dry-run > pack.txt
          echo "Pack contents preview:" && sed -n '1,120p' pack.txt
          ! grep -q "npm_recovery_codes.txt" pack.txt || (echo "Refusing to publish: npm_recovery_codes.txt present" && exit 1)
          ! grep -q ".tmp_server.schema.json" pack.txt || (echo "Refusing to publish: .tmp_server.schema.json present" && exit 1)

      - name: Sync server.json version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public

      - name: Download mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
