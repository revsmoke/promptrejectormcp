# Publish the npm package on version tags; GitHub Releases use Release Drafter.
# MCP Registry publication is deliberately outside the release path: no registry
# schema download, publisher binary, validation, credentials or network calls.
#
# Set the repository variable PUBLISH_NPM=false for GitHub-only releases.
# Otherwise NPM_TOKEN must have publish rights for the prompt-rejector package.
# The existing v* trigger, tag-derived metadata and npm version are preserved.
name: Publish npm package

on:
  push:
    tags:
      - "v*"  # Run on version tags like v1.0.0

permissions:
  contents: read

jobs:
  build-and-publish:
    if: ${{ vars.PUBLISH_NPM != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Sync server.json version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '
            .version = $v
            | .packages |= map(if has("version") then .version = $v else . end)
          ' server.json > server.tmp && mv server.tmp server.json

      - name: Audit npm pack contents (fail on leaked files)
        run: |
          npm pack --dry-run > pack.txt
          echo "Pack contents preview:" && sed -n '1,120p' pack.txt
          ! grep -q "npm_recovery_codes.txt" pack.txt || (echo "Refusing to publish: npm_recovery_codes.txt present" && exit 1)
          ! grep -q ".tmp_server.schema.json" pack.txt || (echo "Refusing to publish: .tmp_server.schema.json present" && exit 1)
          ! grep -q "mcp-publisher" pack.txt || (echo "Refusing to publish: mcp-publisher present" && exit 1)

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public
