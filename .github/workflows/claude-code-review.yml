# Claude Code Review — automated PR reviewer.
#
# Runs on every PR open / synchronize / ready_for_review / reopen and invokes
# the `code-review@claude-code-plugins` plugin via claude-code-action@v1.
#
# Required secrets:
#   - CLAUDE_CODE_OAUTH_TOKEN  Mandatory. OAuth token for the claude-code-action.
#                              Without it the workflow still runs but produces
#                              "No buffered inline comments" / no review output
#                              (observed historically on PR #5 when the token
#                              was unset). Configure it in repo Settings →
#                              Secrets and variables → Actions.
#
# Notes:
#   - `allowed_bots: '*'` lets the action respond on bot-authored PRs.
#   - The review is driven by the `/code-review:code-review` slash command,
#     scoped to the current repo + PR number.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: '*'
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

